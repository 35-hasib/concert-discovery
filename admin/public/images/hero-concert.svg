<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live concert stage with stage lights and a crowd silhouette">
  <defs>
    <radialGradient id="sky" cx="50%" cy="26%" r="82%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#3a1607"/>
      <stop offset="35%" stop-color="#1a0c0a"/>
      <stop offset="75%" stop-color="#0b0809"/>
      <stop offset="100%" stop-color="#060506"/>
    </radialGradient>
    <radialGradient id="stageGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ff7a2e" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f24a0c" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#c22a08" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb27a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff6b1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd6b8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff8f4d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9d7bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d4bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurBeam" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <g opacity="0.5" filter="url(#blurGlow)">
    <ellipse cx="960" cy="800" rx="620" ry="260" fill="#f24a0c"/>
    <ellipse cx="960" cy="840" rx="320" ry="160" fill="#ffb27a"/>
  </g>

  <g filter="url(#blurBeam)">
    <path d="M500 60 L120 900 L520 900 L760 60 Z" fill="url(#beam1)" opacity="0.5"/>
    <path d="M720 40 L520 940 L860 940 L920 40 Z" fill="url(#beam2)" opacity="0.4"/>
    <path d="M1180 40 L1040 940 L1400 940 L1320 40 Z" fill="url(#beam2)" opacity="0.35"/>
    <path d="M1460 60 L1360 900 L1780 900 L1600 60 Z" fill="url(#beam1)" opacity="0.45"/>
    <path d="M900 0 L840 900 L1180 900 L1080 0 Z" fill="url(#beam3)" opacity="0.4"/>
  </g>

  <g opacity="0.9">
    <circle cx="200" cy="180" r="70" fill="#ffb27a" opacity="0.28" filter="url(#blurBeam)"/>
