  <g fill="#1a1a1f" opacity="0.95">
    <circle cx="230" cy="1040" r="70"/>
    <circle cx="440" cy="1060" r="64"/>
    <circle cx="630" cy="1030" r="60"/>
    <circle cx="820" cy="1055" r="72"/>
    <circle cx="1010" cy="1030" r="62"/>
    <circle cx="1200" cy="1060" r="70"/>
    <circle cx="1390" cy="1035" r="60"/>
    <circle cx="1580" cy="1055" r="70"/>
    <circle cx="1770" cy="1035" r="60"/>
  </g>

  <g stroke="#ffb27a" stroke-width="2" opacity="0.5">
